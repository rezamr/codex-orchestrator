name: Implementation CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows quality gates
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      # Keep Node/Vitest on the bundled Node-compatible SQLite prebuild. package.json
      # postinstall is reserved for the later Electron-native rebuild phase.
      - name: Install locked dependencies without Electron postinstall
        run: npm ci --ignore-scripts

      - name: Smoke-test bundled SQLite under Node
        run: node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); if(db.prepare('select 1 as ok').get().ok !== 1) process.exit(1); db.close()"

      - name: Validate OpenSpec
        run: npm run openspec:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test -- --pool=threads

      # Electron tooling and the packaged app need the native dependency rebuilt
      # against Electron after the Node/Vitest test phase has finished.
      - name: Install Electron binary for tooling
        run: node node_modules/electron/install.js

      - name: Rebuild native dependencies for Electron
        run: npm run postinstall

      - name: Electron E2E tests
        run: npm run test:e2e

      - name: Package unpacked application
        run: npm run package
